/* Layout: one-screen presentation app — slim top bar, centered stage, bottom nav. White paper, light sky-blue accents. */
:root{
  --bg:#FFFFFF;          /* 흰 바탕 */
  --bg-deep:#B8E4FC;
  --card:#FFFFFF;
  --ink:#1F2A37;         /* 진한 남색 글씨 */
  --ink-soft:#5B6B7C;
  --sky:#5BB8F2;         /* 포인트 하늘색 */
  --sky-deep:#2E8FD6;
  --sky-soft:#E3F2FE;    /* 단어 칸 */
  --pink:#FFD3D8;
  --pink-deep:#F28C9C;
  --butter:#FFC95E;      /* 이젤 받침 노랑 */
  --butter-deep:#E6A72E;
  --cream:#FFF9EC;       /* 메모지 */
  --wood:#C47A55;
  --leaf:#4FAE7A;        /* 성공 */
  --leaf-soft:#DDF2E3;
  --line:#C9E3F5;
  --dot:#E4EEF5;
  --em:#E5566C;          /* 강조 글씨 */
  --f-display:"AllimjangB","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Allimjang","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;
  background-image:radial-gradient(var(--dot) 1.4px,transparent 1.4px);background-size:22px 22px;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
strong{font-family:var(--f-display);font-weight:400;color:var(--em)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky-deep);outline-offset:3px}

.app{height:100%;display:flex;flex-direction:column;padding-inline:16px}
.app.intro .nav,.app.intro .dots{visibility:hidden}
.top{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding-block:14px 6px;min-height:44px;max-width:1100px;width:100%;margin-inline:auto}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);border:0;padding:0}
.dot.on{background:var(--sky-deep);width:24px;border-radius:6px}
.dot.done{background:var(--sky)}

.stage{flex:1;min-height:0;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center}
.screen{width:100%;max-width:1000px;margin-block:auto;padding-block:20px 28px;display:flex;flex-direction:column;align-items:center;gap:22px;animation:pop .35s ease}
@keyframes pop{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}

.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 16px;max-width:1100px;width:100%;margin-inline:auto}
.navbtn{border:0;background:var(--card);border-radius:999px;padding:10px 20px;font-family:var(--f-display);font-size:18px;box-shadow:0 4px 0 var(--bg-deep);transition:transform .1s}
.navbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bg-deep)}
.navbtn[disabled]{opacity:.35;cursor:default}
.navhint{font-size:13px;color:var(--ink-soft);text-align:center}

/* common */
.eyebrow{font-family:var(--f-display);font-size:16px;letter-spacing:.06em;color:var(--sky-deep);background:var(--card);padding:6px 16px;border-radius:999px;border:2px solid var(--line)}
h1,h2{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;text-align:center;line-height:1.15}
h2{font-size:clamp(30px,5vw,48px)}
.sub{color:var(--ink-soft);font-size:clamp(15px,2vw,18px);text-align:center;margin:0}
.card{background:var(--card);border-radius:28px;border:2px solid var(--line);padding:clamp(18px,3vw,32px)}
/* 메모지 제목 (교안의 클립 메모) */
.memo{position:relative;background:var(--cream);border:2.5px solid var(--ink);padding:14px clamp(28px,5vw,56px);clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),calc(100% - 26px) 100%,0 100%)}
.memo::after{content:"";position:absolute;right:0;bottom:0;width:26px;height:26px;background:linear-gradient(135deg,#B5B0A8 50%,transparent 50%)}
.memo-wrap{position:relative}
.memo-wrap .clip{position:absolute;z-index:1;left:-8px;top:-18px;width:26px;height:46px;border:3px solid var(--ink);border-radius:13px;transform:rotate(-38deg);background:transparent}

/* title: 자음·모음·알파벳 게임 표지와 같은 색상·디자인 */
.title-wrap{display:flex;flex-direction:column;align-items:center;gap:28px;padding-top:2vh;color:#4A3925}
.tl{--t:clamp(34px,4vw,48px);font-family:var(--f-display);font-size:calc(var(--t) * .5);width:var(--t);height:var(--t);display:grid;place-items:center;border-radius:38%;color:#4A3925;background:#FFF3C4;box-shadow:inset 0 0 0 2px #FFD66B,0 4px 0 #F2BC3A}
.tl.v{background:#FFE2D8;box-shadow:inset 0 0 0 2px #FFB9A6,0 4px 0 #F4A28C}
.tl.em{font-family:var(--f-emoji);font-size:calc(var(--t) * .56);line-height:1}
.tl.em svg{width:62%;height:auto}
.eq{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-size:24px;color:#8C7552}
.eq .or{font-size:20px;color:#E23B3B;letter-spacing:.04em}
.big-title{font-size:clamp(52px,11vw,124px)}
.big-title span{display:inline-block}
.big-title .hl{background:linear-gradient(transparent 58%,#FFCB45 58%,#FFCB45 90%,transparent 90%);padding-inline:.06em}
.start{border:0;background:#FFCB45;color:#4A3925;font-family:var(--f-display);font-size:24px;padding:14px 40px;border-radius:999px;box-shadow:0 6px 0 #E6A817}
.start:active{transform:translateY(4px);box-shadow:0 2px 0 #E6A817}

/* rules */
.rule-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;width:100%}
@media (max-width:640px){.rule-row{grid-template-columns:minmax(0,1fr)}}
.rules{display:grid;gap:14px;min-width:0;align-content:center}
.prep{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:12px;background:var(--pink);border-color:#FFB8C2;min-width:200px}
.prep-t{font-family:var(--f-display);font-size:20px;color:#B23A50}
.prep-list{list-style:none;margin:0;padding:0;display:grid;gap:10px;width:100%}
.prep-c{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 16px;font-family:var(--f-display);font-size:20px;cursor:pointer}
.prep-c input{position:absolute;opacity:0;width:1px;height:1px}
.prep-c .box{width:26px;height:26px;flex:none;border-radius:8px;border:2.5px solid var(--pink-deep);background:var(--card);display:grid;place-items:center}
.prep-c .box svg{width:80%;height:80%;opacity:0}
.prep-c input:checked+.box{background:var(--pink-deep)}
.prep-c input:checked+.box svg{opacity:1}
.prep-c:has(input:checked){color:var(--ink-soft)}
.prep-c input:focus-visible+.box{outline:3px solid var(--sky-deep);outline-offset:2px}
.rule{display:flex;gap:16px;align-items:center;font-size:clamp(17px,2.3vw,22px);line-height:1.5}
.rule b{font-family:var(--f-display);font-weight:400;flex:none;min-width:52px;height:40px;border-radius:10px;background:var(--pink);display:grid;place-items:center;font-size:20px}
.rule .txt{min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sky-soft);color:var(--sky-deep);border-radius:999px;padding:2px 12px;font-size:.85em;white-space:nowrap}
.examples{width:100%;display:grid;gap:12px}
.ex{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;background:var(--sky-soft);border-radius:20px;padding:14px 18px;border:2px dashed var(--line)}
.ex .lab{font-family:var(--f-display);color:var(--ink-soft);font-size:16px;min-width:56px}
.exw{font-family:var(--f-display);font-size:clamp(24px,3.4vw,32px);background:var(--card);border-radius:14px;padding:4px 16px;min-width:2.2em;text-align:center}

.exm{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.exi{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:clamp(17px,2.2vw,20px);background:var(--card);border-radius:999px;padding:6px 16px 6px 10px}

.reveal{border:2px solid var(--sky-deep);background:var(--card);border-radius:999px;padding:6px 18px;font-family:var(--f-display);font-size:17px}

/* concept */
.define{font-family:var(--f-display);font-size:clamp(20px,3vw,28px);text-align:center;line-height:1.5}

.wordbox{font-family:var(--f-display);font-size:clamp(64px,11vw,110px);line-height:1;background:var(--sky-soft);border-radius:28px;padding:.25em .5em;min-width:2em;text-align:center}

/* meaning cards (교안의 그림 카드) */
.means{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:18px;width:100%;max-width:820px}
.mean{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--sky-soft);border-radius:22px;padding:30px 14px 18px;animation:pop .35s ease both}
.mean:nth-child(2){animation-delay:.08s}.mean:nth-child(3){animation-delay:.16s}
.mean .no{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:var(--pink);font-family:var(--f-display);font-size:18px;display:grid;place-items:center}
.mean .pic{width:100%;aspect-ratio:4/3;max-height:150px;background:var(--card);border-radius:12px;display:grid;place-items:center;font-family:var(--f-emoji);font-size:clamp(56px,8vw,78px);line-height:1;position:relative;border-top:10px solid var(--card)}
.mean .pic::before{content:"";position:absolute;top:-10px;left:6px;right:6px;height:7px;background:repeating-linear-gradient(90deg,#B7C3CF 0 2px,transparent 2px 8px)}
.mean .pic svg{width:58%;height:auto}
.mean .lab{font-family:var(--f-display);font-size:clamp(18px,2.4vw,22px);text-align:center}
.mean .eg{font-size:14px;color:var(--ink-soft);text-align:center;margin-top:-6px}

/* round */
.round-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}
.score{font-family:var(--f-display);font-size:16px;background:var(--butter);border-radius:999px;padding:6px 16px;display:inline-flex;align-items:center;gap:6px}
.score .ico{width:1.2em;height:1.2em}
.workbench{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;width:100%;align-items:stretch}
@media (max-width:720px){.workbench{grid-template-columns:minmax(0,1fr)}}
.board{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-width:0}
.board .wordbox{width:100%;padding:.32em .3em;font-size:clamp(84px,15vw,160px);overflow-wrap:anywhere}
.draw{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-soft);text-align:center}
.draw svg{width:20px;height:20px;flex:none}
.reveal-btn{border:0;background:var(--sky);color:#fff;font-family:var(--f-display);font-size:22px;padding:12px 34px;border-radius:999px;box-shadow:0 5px 0 var(--sky-deep)}
.reveal-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sky-deep)}
.ask{font-family:var(--f-display);font-size:clamp(24px,4vw,36px);text-align:center;margin:0}
.verdict{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.vb{display:inline-flex;align-items:center;gap:10px;border:2.5px solid var(--line);background:var(--card);font-family:var(--f-display);font-size:clamp(18px,2.4vw,22px);padding:12px 26px;border-radius:999px;box-shadow:0 5px 0 var(--line);transition:transform .1s,background .15s}
.vb:active{transform:translateY(3px)}
.vb svg{width:28px;height:28px}
.vb.o[aria-pressed="true"]{background:var(--leaf-soft);border-color:var(--leaf);box-shadow:0 5px 0 var(--leaf)}
.vb.x[aria-pressed="true"]{background:var(--pink);border-color:var(--pink-deep);box-shadow:0 5px 0 var(--pink-deep)}
.vmsg{font-family:var(--f-display);font-size:18px;min-height:1.4em;margin:0;text-align:center}
.vmsg.o{color:#2F7A50}.vmsg.x{color:var(--em)}

.timer{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:200px}
.clock{font-family:var(--f-display);font-size:52px;font-variant-numeric:tabular-nums;line-height:1}
.clock.low{color:var(--pink-deep)}
.clock.end{animation:shake .5s ease 3}
@keyframes shake{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.ring{width:100%;height:10px;border-radius:999px;background:var(--sky-soft);overflow:hidden}
.ring i{display:block;height:100%;background:var(--sky);border-radius:999px;transition:width .3s linear}
.tbtns{display:flex;gap:6px}
.tb{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;font-family:var(--f-display);font-size:15px;min-width:44px}
.tb.main{background:var(--butter);border-color:var(--butter-deep)}
.no-talk{font-size:13px;color:var(--ink-soft)}

/* ready */
.goal{font-family:var(--f-display);font-size:clamp(18px,2.6vw,24px);background:var(--pink);border-radius:18px;padding:12px 28px;display:flex;align-items:center;gap:10px;text-align:center}
.sparkle{font-family:var(--f-emoji)}

/* ending */
.result{display:flex;flex-direction:column;align-items:center;gap:6px}
.result .pts{font-family:var(--f-display);font-size:clamp(64px,12vw,120px);line-height:1}
.result .pts small{font-size:.4em;color:var(--ink-soft)}
.badge{font-family:var(--f-display);font-size:clamp(20px,3vw,28px);padding:10px 28px;border-radius:999px;background:var(--leaf-soft);color:#2F7A50;border:2.5px solid var(--leaf)}
.badge.no{background:var(--card);color:var(--em);border-color:var(--pink-deep)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:100%;max-width:820px;margin:0;padding:0}
.album li{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 16px}
.album .w{font-family:var(--f-display);font-size:22px}
.album .r{font-family:var(--f-display);font-size:15px;color:var(--ink-soft)}
.album .r.o{color:#2F7A50}.album .r.x{color:var(--em)}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:10}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- 아이콘 ---------- */
.ico{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.with-ico{display:inline-flex;align-items:center;gap:.3em}
.hero-ico{width:clamp(72px,10vw,96px);height:auto}
.clock-ico{width:40px;height:40px}
.prep-c .ico{width:24px;height:24px}
/* 화면 크기 전환 */
.vsw{display:flex;flex:none;gap:2px;padding:3px;background:var(--card);border:2px solid var(--line);border-radius:12px}
.vsw button{display:flex;align-items:center;gap:5px;height:28px;padding:0 10px;border:0;border-radius:8px;background:none;font-family:var(--f-display);font-size:13px;color:var(--ink-soft);transition:background .15s,color .15s}
.vsw button:hover{color:var(--ink)}
.vsw button[aria-pressed="true"]{background:var(--sky);color:#fff}
.vsw svg{width:15px;height:15px;flex:none}
html.in-frame .vsw{display:none}
#phoneView{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:64px 16px 24px;background:var(--bg)}
#phoneView[hidden]{display:none}
#phoneView .pv-bar{position:absolute;top:14px;right:calc(max(0px,(100vw - 1132px) / 2) + 16px)}
.phone{width:414px;height:min(868px,calc(100vh - 88px));padding:12px;border-radius:46px;background:var(--ink);box-shadow:0 24px 60px rgba(31,42,55,.22)}

@media (max-width:640px){.vsw span{display:none}.vsw button{padding:0 7px}}

<script>
(function(){
  if(window.name==="ttok-mobile"){document.documentElement.classList.add("in-frame");return;}
  const KEY="ttok-game-view", VP_DEVICE="width=device-width, initial-scale=1, viewport-fit=cover";
  const phone=matchMedia("(pointer:coarse)").matches&&Math.min(screen.width,screen.height)<768;
  const vp=document.querySelector('meta[name="viewport"]');
  const pv=document.getElementById("phoneView"), frame=pv.querySelector("iframe");
  function setView(v,save){
    if(phone){
      /* 휴대폰: PC를 고르면 넓은 화면을 줄여서 보여 줌 */
      vp.content=v==="pc"?"width=1200":VP_DEVICE;
    }else{
      /* PC: 모바일을 고르면 휴대폰 크기 창에서 같은 주소(체험 모드 포함)를 엶 */
      if(v==="m"&&!frame.getAttribute("src")) frame.src=location.href;
      pv.hidden=v!=="m";
      document.documentElement.classList.toggle("view-m",v==="m");
    }
    document.querySelectorAll(".vsw button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.view===v)));
    if(save){try{localStorage.setItem(KEY,v)}catch(e){}}
  }
  let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  setView(saved==="m"?"m":"pc");
  document.addEventListener("click",e=>{const b=e.target.closest(".vsw button");if(b)setView(b.dataset.view,true);});
  /* 휴대폰 창이 열려 있으면 뒤쪽 게임은 방향키에 반응하지 않게 */
  document.addEventListener("keydown",e=>{if(document.documentElement.classList.contains("view-m"))e.stopImmediatePropagation();},true);
})();

/* 그림 카드: 이모지 또는 ART 키(이모지가 없는 그림) */
const ART={
  belly:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M18 6C14 20 12 34 16 46C19 54 26 58 32 58C38 58 45 54 48 46C52 34 50 20 46 6" fill="#FFD9C2" stroke="#1F2A37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 44H50" stroke="#1F2A37" stroke-width="3" stroke-linecap="round"/><path d="M15 44C15 52 22 60 32 60C42 60 49 52 49 44Z" fill="#2E3A48"/><path d="M29 30C30 33 34 33 35 30" fill="none" stroke="#1F2A37" stroke-width="2.6" stroke-linecap="round"/></svg>',
  glue:'<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="22" y="22" width="20" height="36" rx="4" fill="#5BB8F2" stroke="#1F2A37" stroke-width="3"/><rect x="22" y="34" width="20" height="10" fill="#FFFFFF" stroke="#1F2A37" stroke-width="3"/><path d="M24 22V14C24 10 27 8 32 8C37 8 40 10 40 14V22" fill="#FFF9EC" stroke="#1F2A37" stroke-width="3"/><rect x="20" y="54" width="24" height="6" rx="2" fill="#2E8FD6" stroke="#1F2A37" stroke-width="3"/></svg>',
};
// 연습 게임 단어
const WARM={w:'배',m:[['🍐','먹는 배'],['🚢','타는 배'],['@belly','신체 부위 배']]};
// 본 게임 단어 (교안 순서)
const ROUNDS=[
  {w:'밤',m:[['🌙','어두운 밤','밤하늘'],['🌰','먹는 밤','군밤']]},
  {w:'눈',m:[['👀','보는 눈','얼굴의 눈'],['❄️','내리는 눈','눈사람']]},
  {w:'Fly',m:[['🪰','파리','곤충 fly'],['🕊️','날다','새가 fly']]},
  {w:'차',m:[['🚗','타는 차','자동차'],['🍵','마시는 차','녹차']]},
  {w:'다리',m:[['🦵','신체 다리','팔다리'],['🌉','건너는 다리','한강 다리']]},
  {w:'풀',m:[['🌿','자라는 풀','풀밭'],['@glue','붙이는 풀','딱풀']]},
  {w:'Bat',m:[['🦇','박쥐','동물 bat'],['🏏','방망이','야구 bat']]},
  {w:'Right',m:[['👉','오른쪽','turn right'],['✅','옳은, 맞는','That\'s right!']]},
  {w:'달',m:[['🌕','하늘의 달','보름달'],['📅','날짜의 달','1년은 12달']]},
  {w:'차다',m:[['⚽','발로 차다','공을 차다'],['🧊','차갑다','물이 차다'],['🥛','가득 차다','컵이 차다']]},
  {w:'말',m:[['🐴','동물 말','말을 타다'],['💬','하는 말','말을 하다']]},
  {w:'이',m:[['🦷','치아','이를 닦다'],['2️⃣','숫자 이','일, 이, 삼']]},
];
const GOAL=7;
// 규칙 화면 예시 문제 (본 게임에 없는 단어)
const EXAMPLES=[
  {w:"공",m:[["⚽","차는 공"],["0️⃣","숫자 공(0)"]]},
  {w:"쓰다",m:[["✏️","글을 쓰다"],["🧢","모자를 쓰다"],["☕","맛이 쓰다"]]},
];
const exHTML=e=>`<span class="exw">${e.w}</span><span class="arrow">→</span><span class="exm">${e.m.map(([p,l])=>`<span class="exi"><span class="em">${p}</span>${l}</span>`).join("<span class=\"or\">OR</span>")}</span>`;
/* 체험 모드(?trial=1): 2번 문제까지만 풀고 안내 화면으로 끝남 */
const TRIAL=new URLSearchParams(location.search).has('trial');
const roundIdx=()=>TRIAL?[0,1]:ROUNDS.map((_,k)=>k);
// 화면 순서: 표지 → 규칙 → 동음이의어 → 연습 게임 → 본 게임 안내 → 라운드 → 마무리
const screens=()=>['title','rules','concept','warm','ready',...roundIdx().map(k=>'r'+k),TRIAL?'trialEnd':'end'];

let S={i:0,prep:{},rev:{},res:{},cheered:{},ex2:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const score=()=>roundIdx().filter(k=>S.res[k]==='o').length;
const CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SK='stroke="#1F2A37" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
const ICONS={
  board:`<rect x="10" y="9" width="28" height="34" rx="6" fill="#FFF9EC" ${SK}/><rect x="17" y="5" width="14" height="8" rx="3" fill="#F28C9C" ${SK}/><path d="M17 22H31M17 29H31M17 36H25" fill="none" ${SK}/>`,
  bulb:`<path d="M24 7C16 7 11 13 11 20C11 25 14 28 17 31V35H31V31C34 28 37 25 37 20C37 13 32 7 24 7Z" fill="#FFE08A" ${SK}/><path d="M18 40H30" fill="none" ${SK}/><path d="M20 22L23 26L28 19" fill="none" ${SK}/>`,
  dumbbell:`<rect x="5" y="16" width="9" height="16" rx="4" fill="#FFD3D8" ${SK}/><rect x="34" y="16" width="9" height="16" rx="4" fill="#FFD3D8" ${SK}/><path d="M14 24H34" fill="none" ${SK}/>`,
  alarm:`<circle cx="24" cy="26" r="15" fill="#E3F2FE" ${SK}/><path d="M9 13L14 8M39 13L34 8" fill="none" ${SK}/><path d="M24 17V26L30 30" fill="none" ${SK}/><path d="M14 41L17 38M34 41L31 38" fill="none" ${SK}/>`,
  star:`<path d="M24 6L29 18L42 19L32 27L35 40L24 33L13 40L16 27L6 19L19 18Z" fill="#FFC95E" ${SK}/>`,
  party:`<path d="M8 42L18 14L36 32Z" fill="#FFC95E" ${SK}/><path d="M13 28L24 36" fill="none" ${SK}/><circle cx="30" cy="10" r="2.5" fill="#F28C9C"/><circle cx="39" cy="18" r="2.5" fill="#5BB8F2"/><circle cx="41" cy="8" r="2" fill="#FFD3D8"/><path d="M24 8C26 11 25 14 27 16M35 26C38 24 41 26 43 24" fill="none" ${SK}/>`,
  crown:`<path d="M8 36L9 14L18 24L24 9L30 24L39 14L40 36Z" fill="#FFC95E" ${SK}/><path d="M8 36H40" fill="none" ${SK}/><circle cx="24" cy="29" r="3" fill="#F28C9C"/><circle cx="15" cy="30" r="2.2" fill="#5BB8F2"/><circle cx="33" cy="30" r="2.2" fill="#5BB8F2"/>`,
  paper:`<rect x="9" y="8" width="30" height="24" rx="2" fill="#FFFFFF" ${SK}/><path d="M24 32V38M24 38L15 44M24 38L33 44" fill="none" stroke="#C47A55" stroke-width="3.5" stroke-linecap="round"/><rect x="7" y="31" width="34" height="5" rx="2.5" fill="#C47A55" ${SK}/><path d="M20 20C21 22 23 22 24 20" fill="none" stroke="#F28C9C" stroke-width="2.4" stroke-linecap="round"/>`,
  pen:`<path d="M10 38L12 30L32 10L38 16L18 36Z" fill="#FFD3D8" ${SK}/><path d="M28 14L34 20" fill="none" ${SK}/><path d="M10 38L16 36L12 32Z" fill="#1F2A37"/>`,
  palette:`<path d="M24 7C13 7 6 15 6 24C6 33 13 41 22 41C25 41 26 39 25 37C24 34 26 32 29 32H34C39 32 42 28 42 23C42 14 34 7 24 7Z" fill="#FFF3D6" ${SK}/><circle cx="15" cy="22" r="3.2" fill="#F26B6B"/><circle cx="20" cy="14" r="3.2" fill="#FFC95E"/><circle cx="29" cy="13" r="3.2" fill="#F28C9C"/><circle cx="35" cy="20" r="3.2" fill="#5BB8F2"/>`,
  brush:`<path d="M30 6L42 18L26 34L14 22Z" fill="#5BB8F2" ${SK}/><path d="M14 22L26 34L20 38C16 41 10 42 6 42C6 38 7 32 10 28Z" fill="#C47A55" ${SK}/>`,
  oShape:`<circle cx="24" cy="24" r="15" fill="none" stroke="#4FAE7A" stroke-width="6"/>`,
  xShape:`<path d="M12 12L36 36M36 12L12 36" fill="none" stroke="#E5566C" stroke-width="6" stroke-linecap="round"/>`,
};
const ico=(n,c='')=>`<svg class="ico${c?' '+c:''}" viewBox="0 0 48 48" aria-hidden="true">${ICONS[n]}</svg>`;
const PENCIL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19z" fill="#FFC95E" stroke="#1F2A37" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 7l3 3" stroke="#1F2A37" stroke-width="1.6"/></svg>';
const pic=p=>p[0]==='@'?ART[p.slice(1)]:p;
const memo=t=>`<div class="memo-wrap"><span class="clip"></span><div class="memo"><h2>${t}</h2></div></div>`;
const meansHTML=m=>`<div class="means">${m.map(([p,lab,eg],n)=>`<div class="mean"><span class="no">${n+1}</span><div class="pic">${pic(p)}</div><span class="lab">${esc(lab)}</span>${eg?`<span class="eg">${esc(eg)}</span>`:''}</div>`).join('')}</div>`;
const josa=w=>{const c=w.charCodeAt(w.length-1)-0xAC00;return c>=0&&c<=11171?(c%28?'을':'를'):'를'};

const VIEWS={
  title:()=>`<div class="screen title-wrap">
    <div class="eq" aria-label="배는 먹는 배 또는 타는 배 또는 신체 부위 배"><span class="tl">배</span><span>=</span><span class="tl v em">🍐</span><span class="or">OR</span><span class="tl v em">🚢</span><span class="or">OR</span><span class="tl v em">${ART.belly}</span></div>
    <h1 class="big-title"><span class="hl">동상이몽</span><br><span>그림 퀴즈</span></h1>
    <button class="start" type="button" data-go="1">게임 시작</button>
  </div>`,

  rules:()=>`<div class="screen">
    <h2 class="with-ico">${ico('board')}게임 규칙</h2>
    <div class="rule-row">
      <div class="card rules">
        <div class="rule"><b>01</b><div class="txt">화면에 <strong>동음이의어</strong>가 제시돼요.</div></div>
        <div class="rule"><b>02</b><div class="txt">단어를 보고 <strong>1분</strong> 동안 그림을 그려요.</div></div>
        <div class="rule"><b>03</b><div class="txt">짝꿍과 <strong>같은 그림</strong>을 그리면 성공!</div></div>
      </div>
      <div class="card prep">
        <span class="prep-t">준비물</span>
        <ul class="prep-list">${[['paper','종이'],['pen','펜'],['palette','색칠도구']].map(([id,t])=>`<li><label class="prep-c" for="prep-${id}"><input type="checkbox" id="prep-${id}" data-prep="${id}"${S.prep[id]?' checked':''}><span class="box">${CHECK}</span>${ico(id)}${t}</label></li>`).join('')}</ul>
      </div>
    </div>
    <div class="examples">
      ${(()=>{const [e1,e2]=EXAMPLES;return `<div class="ex"><span class="lab">예시 1</span>${exHTML(e1)}</div>
      <div class="ex"><span class="lab">예시 2</span>${S.ex2?exHTML(e2):`<span class="exw">${e2.w}</span><span class="arrow">→</span><span class="sent">어떤 그림을 그릴 수 있을까요?</span><button class="reveal" type="button" data-act="ex2">예시 보기</button>`}</div>`})()}
    </div>
    <p class="answer-tip">앞에 놓인 준비물을 자유롭게 활용해 주세요!</p>
  </div>`,

  concept:()=>`<div class="screen">
    <span class="eyebrow with-ico">${ico('bulb')}잠깐! 동음이의어란?</span>
    <p class="define">소리는 서로 같지만 <strong>다른 뜻</strong>을 가진 낱말이에요
      <span class="sm">같은 단어를 보고도 서로 다른 그림을 떠올릴 수 있어요</span></p>
    <div class="split">
      <div class="wordbox">사과</div>
      <span class="arrow">→</span>
      ${meansHTML([['🍎','먹는 사과'],['🙇','잘못을 비는 사과']]).replace('class="means"','class="means" style="max-width:480px;flex:1 1 320px"')}
    </div>
    <p class="answer-tip">제시된 동음이의어를 보고 같은 그림을 그리면 성공!</p>
  </div>`,

  warm:()=>roundView(-1),

  ready:()=>`<div class="screen">
    ${memo('자, 이제 본격적으로<br>게임을 시작할게요!')}
    <div class="goal"><span class="sparkle">✨</span>${GOAL}점 이상 모으면 오늘의 퀘스트 complete!!<span class="sparkle">✨</span></div>
    <p class="sub">${TRIAL?'체험은 2문제만 할 수 있어요':`모두 ${ROUNDS.length}문제 · 성공하면 1점`}</p>
  </div>`,

  trialEnd:()=>`<div class="screen">
    ${ico('party','hero-ico')}
    <h2>체험은 여기까지예요</h2>
    <p class="sub">2번 문제까지 풀어봤어요. 전체 ${ROUNDS.length}문제는 처음부터 다시 시작해서 해 볼 수 있어요</p>
    <button class="start" type="button" data-go="0">처음으로</button>
  </div>`,

  end:()=>{const p=score(), ok=p>=GOAL;return `<div class="screen">
    ${ico(ok?'crown':'party','hero-ico')}
    <h2>${ok?'오늘의 퀘스트 complete!':'모두 수고했어요!'}</h2>
    <div class="result"><span class="pts">${p}<small> / ${ROUNDS.length}점</small></span></div>
    <span class="badge${ok?'':' no'}">${ok?`${GOAL}점 이상! 마음이 척척 통했어요`:`${GOAL}점까지 ${GOAL-p}점 남았어요. 다음에 다시 도전!`}</span>
    <ul class="album">${ROUNDS.map((r,k)=>{const v=S.res[k];return `<li><span class="w">${esc(r.w)}</span><span class="r${v?' '+v:''}">${v==='o'?'성공':v==='x'?'실패':'—'}</span></li>`}).join('')}</ul>
    <p class="sub">서로 그린 그림을 다시 보여 주며 이야기 나눠 보세요</p>
    <button class="start" type="button" data-act="restart">처음으로</button>
  </div>`},
};

// k=-1 은 연습 게임
function roundView(k){
  const practice=k<0, r=practice?WARM:ROUNDS[k], ids=roundIdx(), rev=S.rev[k];
  const head=practice
    ?`<span class="eyebrow with-ico">${ico('dumbbell')}연습 게임</span>`
    :`<span class="eyebrow">라운드 ${ids.indexOf(k)+1} / ${ids.length}</span><span class="score">${ico('star')}${score()}점</span>`;
  return `<div class="screen">
    <div class="round-head">${head}</div>
    <div class="workbench">
      <div class="card board">
        <div class="wordbox" lang="${/[a-z]/i.test(r.w)?'en':'ko'}">${esc(r.w)}</div>
        <div class="draw">${PENCIL}단어를 보고 떠오르는 그림을 종이에 그려 보세요</div>
      </div>
      <div class="card timer">
        ${ico('alarm','clock-ico')}
        <div class="clock" id="clock">1:00</div>
        <div class="ring"><i id="bar" style="width:100%"></i></div>
        <div class="tbtns">
          <button class="tb" type="button" data-act="tminus" aria-label="30초 줄이기">−30초</button>
          <button class="tb main" type="button" data-act="tgo" id="tgo">시작</button>
          <button class="tb" type="button" data-act="tplus" aria-label="30초 늘리기">+30초</button>
        </div>
        <button class="tb" type="button" data-act="treset">다시</button>
        <span class="no-talk">그리는 동안 상의하지 않아요</span>
      </div>
    </div>
    ${rev?`<p class="ask">어떤 ‘${esc(r.w)}’${josa(r.w)} 그렸나요?</p>
      ${meansHTML(r.m)}
      ${practice?`<p class="answer-tip">서로 같은 그림이었나요? 연습이니까 점수는 없어요!</p>`
      :`<div class="verdict" role="group" aria-label="결과">
        <button class="vb o" type="button" data-act="res" data-v="o" aria-pressed="${S.res[k]==='o'}">${ico('oShape')}같은 그림! 성공</button>
        <button class="vb x" type="button" data-act="res" data-v="x" aria-pressed="${S.res[k]==='x'}">${ico('xShape')}다른 그림… 실패</button>
      </div>
      <p class="vmsg ${S.res[k]||''}">${S.res[k]==='o'?'+1점! 마음이 통했어요':S.res[k]==='x'?'아쉬워요! 다음 단어에서 다시 도전':'&nbsp;'}</p>`}`
    :`<button class="reveal-btn" type="button" data-act="reveal">그림 공개! 정답 보기</button>`}
  </div>`;
}

/* ---------- 타이머 ---------- */
const T={total:60,left:60,run:false,id:null};
function tDraw(){
  const c=$('#clock'); if(!c) return;
  const m=Math.floor(T.left/60), s=T.left%60;
  c.textContent=`${m}:${String(s).padStart(2,'0')}`;
  c.classList.toggle('low',T.left<=15);
  $('#bar').style.width=(T.total?T.left/T.total*100:0)+'%';
  $('#tgo').textContent=T.run?'멈춤':(T.left===0?'끝!':'시작');
}
function tStop(){T.run=false;clearInterval(T.id);T.id=null}
function tReset(){tStop();T.left=T.total;tDraw()}
function tToggle(){
  if(T.run){tStop();tDraw();return}
  if(T.left===0) T.left=T.total;
  T.run=true;
  T.id=setInterval(()=>{
    T.left=Math.max(0,T.left-1);
    if(T.left===0){tStop();const c=$('#clock');if(c){c.classList.remove('end');void c.offsetWidth;c.classList.add('end');c.textContent='0:00'}}
    tDraw();
  },1000);
  tDraw();
}
function tAdj(d){T.total=Math.min(600,Math.max(30,T.total+d));T.left=Math.min(600,Math.max(0,T.left+d));if(!T.run&&T.left===0)T.left=T.total;tDraw()}

/* ---------- 화면 그리기 ---------- */
function keyRound(key){return key==='warm'?-1:/^r\d+$/.test(key)?+key.slice(1):null}
function render(){
  const SC=screens(); const key=SC[S.i];
  const k=keyRound(key);
  $('#stage').innerHTML=k===null?VIEWS[key]():roundView(k); $('#stage').scrollTop=0;
  $('#dots').innerHTML=SC.map((_,n)=>`<button class="dot${n===S.i?' on':n<S.i?' done':''}" type="button" data-go="${n}" aria-label="${n+1}번째 화면"></button>`).join('');
  document.querySelector('.app').classList.toggle('intro',S.i===0);
  $('#prev').disabled=S.i===0; $('#next').disabled=S.i===SC.length-1;
  if(k!==null) tDraw();
}
function go(n){
  const SC=screens(); n=Math.max(0,Math.min(SC.length-1,n)); if(n===S.i) return;
  S.i=n; tReset(); render();
  if(SC[n]==='end'&&score()>=GOAL) confetti();
}
// 다시 그리기 (타이머·스크롤 위치 유지)
function refresh(){const st=$('#stage'),y=st.scrollTop;const keep=T.run;render();st.scrollTop=y;if(keep)tDraw()}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){go(+g.dataset.go);return}
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, k=keyRound(screens()[S.i]);
  if(act==='reveal'){S.rev[k]=true;refresh();const m=$('.means');if(m)m.scrollIntoView({behavior:'smooth',block:'nearest'})}
  else if(act==='res'){const v=a.dataset.v;S.res[k]=S.res[k]===v?undefined:v;refresh();if(S.res[k]==='o'&&!S.cheered[k]){S.cheered[k]=true;confetti()}}
  else if(act==='ex2'){S.ex2=true;refresh()}
  else if(act==='restart'){S={i:0,prep:S.prep,rev:{},res:{},cheered:{},ex2:false};tReset();render()}
  else if(act==='tgo') tToggle();
  else if(act==='treset') tReset();
  else if(act==='tminus') tAdj(-30);
  else if(act==='tplus') tAdj(30);
});
document.addEventListener('change',e=>{
  if(e.target.dataset&&e.target.dataset.prep) S.prep[e.target.dataset.prep]=e.target.checked;
});
$('#prev').onclick=()=>go(S.i-1);
$('#next').onclick=()=>go(S.i+1);
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||S.i===0) return;
  if(e.key==='ArrowRight'||e.key==='PageDown') go(S.i+1);
  if(e.key==='ArrowLeft'||e.key==='PageUp') go(S.i-1);
});

/* ---------- 축하 꽃가루 ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=$('#confetti'), cx=cv.getContext('2d');
  cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#5BB8F2','#F28C9C','#FFC95E','#FFD3D8','#4FAE7A'];
  const ps=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,r:Math.random()*6+4,c:cols[Math.random()*cols.length|0],a:Math.random()*6,life:0}));
  (function f(){
    cx.clearRect(0,0,cv.width,cv.height); let alive=false;
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.15;p.life++;
      if(p.y<cv.height+20&&p.life<160){alive=true;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()}});
    if(alive) requestAnimationFrame(f); else cx.clearRect(0,0,cv.width,cv.height);
  })();
}

render();
</script>

</html>
